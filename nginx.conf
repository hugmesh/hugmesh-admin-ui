# Per-request CSP nonce source. nginx has no built-in random, so we reuse
# $request_id (a 32-hex-char value generated fresh for every request) as the
# nonce. Defined at http scope (this file is included inside the http block via
# conf.d/default.conf) so both the sub_filter rewrite and the CSP header can
# reference the SAME per-response value.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remotes + OAuth
    # redirect flows. Emitted with `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY (consistent with the
    #     CSP frame-ancestors 'none' below) — this remote is loaded by the host
    #     shell via <script> (native federation), NOT via <iframe>, so no framing
    #     is ever required.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # Content-Security-Policy (strong, nonce-based XSS backstop): there is NO
    # 'unsafe-inline' / 'unsafe-hashes' in script-src — only the per-response
    # nonce. The sub_filter below rewrites every '<script' in index.html to carry
    # nonce="$cspnonce", and es-module-shims (2.8.1) auto-propagates that nonce to
    # the module scripts it injects, so native federation keeps working.
    #   - default-src 'self'                       : same-origin default for everything.
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only nonce'd same-origin
    #                                                 scripts run; blob: is for
    #                                                 worker/shim-created scripts.
    #   - style-src 'self' 'unsafe-inline' blob:   : Angular sets component styles
    #                                                 inline at runtime, so
    #                                                 'unsafe-inline' is REQUIRED.
    #   - img-src 'self' data: blob: https:        : avatars/media incl. data:/blob:.
    #   - font-src 'self' data:                    : webfonts incl. inlined data:.
    #   - connect-src 'self' blob: https: wss:     : BFF/gateway origins are
    #                                                 env-configured, so broad.
    #   - worker-src 'self' blob:                  : module-federation/web workers.
    #   - base-uri 'self'                          : stop <base> tag hijacking.
    #   - object-src 'none'                        : block <object>/<embed>.
    #   - frame-ancestors 'none'                   : no framing (mirrors XFO DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has multiple <script> tags.
        #   - sub_filter_types text/html : ONLY rewrite HTML; JS/CSS bundles are
        #                                  left byte-for-byte untouched.
        # Do NOT enable gzip_static / precompressed index.html — sub_filter cannot
        # rewrite an already-compressed response body.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Type text/plain;
    }
}
