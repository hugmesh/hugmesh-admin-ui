<section class="snap-isos" data-testid="iso-view" aria-labelledby="iso-heading">
  <h2 id="iso-heading">ISO downloads</h2>
  <p *ngIf="!isos().length" data-testid="iso-empty">No ISO builds delivered yet.</p>
  <ul data-testid="iso-list" aria-label="Available ISO downloads">
    <li *ngFor="let iso of isos()" [attr.data-iso]="iso.name">
      <a [attr.href]="iso.url" [attr.data-iso-url]="iso.url" download>
        {{ iso.name }}<span class="sr"> (download ISO)</span>
      </a>
    </li>
  </ul>
</section>
