<section class="snap-route-access" data-testid="route-access-view" aria-labelledby="ra-heading">
  <h2 id="ra-heading">Gateway access — role → URL</h2>

  <form (ngSubmit)="add()" novalidate>
    <label for="ra-gateway">Gateway</label>
    <select id="ra-gateway" data-testid="ra-gateway" [(ngModel)]="gateway" name="gateway">
      <option *ngFor="let g of gateways" [value]="g">{{ g }}</option>
    </select>

    <label for="ra-pattern">URL pattern</label>
    <input
      id="ra-pattern"
      data-testid="ra-pattern"
      [(ngModel)]="urlPattern"
      name="pattern"
      placeholder="/api/admin/**"
      [attr.aria-invalid]="formError() ? 'true' : null"
      [attr.aria-describedby]="formError() ? 'ra-error' : null"
    />

    <label for="ra-role">Role</label>
    <input
      id="ra-role"
      data-testid="ra-role"
      [(ngModel)]="role"
      name="role"
      placeholder="ROLE_ADMIN"
      [attr.aria-invalid]="formError() ? 'true' : null"
      [attr.aria-describedby]="formError() ? 'ra-error' : null"
    />

    <label for="ra-allow"><input id="ra-allow" type="checkbox" [(ngModel)]="allow" name="allow" /> allow</label>
    <button data-testid="ra-add" type="submit">Add rule</button>

    <span
      *ngIf="formError()"
      id="ra-error"
      class="field-error"
      data-testid="ra-error"
      role="alert"
      aria-live="assertive"
    >{{ formError() }}</span>
  </form>

  <table data-testid="route-access-rules">
    <caption class="sr">Gateway access rules: role to URL allow or deny per gateway</caption>
    <thead>
      <tr>
        <th scope="col">Gateway</th>
        <th scope="col">URL pattern</th>
        <th scope="col">Role</th>
        <th scope="col">Allow</th>
        <th scope="col"><span class="sr">Actions</span></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of rules()" [attr.data-rule-id]="r.id">
        <td>{{ r.gateway }}</td><td>{{ r.url_pattern }}</td><td>{{ r.role }}</td>
        <td>{{ r.allow ? 'allow' : 'deny' }}</td>
        <td>
          <button
            type="button"
            [attr.data-remove]="r.id"
            [attr.aria-label]="'Remove rule for ' + r.role + ' on ' + r.url_pattern"
            (click)="remove(r.id)"
          >remove</button>
        </td>
      </tr>
    </tbody>
  </table>
</section>
