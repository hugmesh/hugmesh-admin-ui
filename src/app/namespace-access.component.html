<section class="hug-ns" data-testid="ns-view" aria-labelledby="ns-heading">
  <h2 id="ns-heading">Namespace access</h2>

  <form (ngSubmit)="grant()" novalidate>
    <label for="ns-user">User</label>
    <!--
      Commits `provider:handle` — the form AccountStore#namespacesFor matches on
      (Account.id()); the grant endpoint documents accepting either that or a bare username.
      Suggestions are scoped to this admin's own domains SERVER-SIDE.
    -->
    <hug-user-typeahead
      inputId="ns-user"
      testId="ns-user"
      name="user"
      commit="qualified"
      placeholder="start typing a user…"
      [(value)]="user"
      [invalid]="!!userError()"
      [describedBy]="userError() ? 'ns-user-error ns-user-help' : 'ns-user-help'"
    ></hug-user-typeahead>
    <span id="ns-user-help" class="hint">
      Suggestions are users in the domains you administer. You can also type an email or
      Discord handle directly.
    </span>

    <label for="ns-select">Namespace</label>
    <select id="ns-select" data-testid="ns-select" [(ngModel)]="namespace" name="namespace">
      <option *ngFor="let n of namespaces()" [value]="n">{{ n }}</option>
    </select>

    <button data-testid="ns-grant" type="submit">Grant</button>

    <span
      *ngIf="userError()"
      id="ns-user-error"
      class="field-error"
      data-testid="ns-user-error"
      role="alert"
      aria-live="assertive"
    >{{ userError() }}</span>
  </form>

  <ul data-testid="ns-grants" aria-label="Existing namespace grants">
    <li *ngFor="let g of grants()" [attr.data-user]="g.user">
      <strong>{{ g.user }}</strong>: {{ g.namespaces.join(', ') }}
    </li>
  </ul>
</section>
