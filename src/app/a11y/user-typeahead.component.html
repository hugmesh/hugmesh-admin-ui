<!--
  APG "combobox with listbox popup". DOM focus stays on the input at all times; the
  highlighted option is communicated by aria-activedescendant, never by moving focus.
-->
<div class="hug-typeahead">
  <input
    #input
    class="ta-input"
    type="text"
    role="combobox"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    [id]="inputId"
    [attr.name]="name"
    [attr.data-testid]="testId || null"
    [attr.placeholder]="placeholder || null"
    [attr.maxlength]="maxLength"
    [value]="value"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listboxId"
    aria-autocomplete="list"
    [attr.aria-activedescendant]="activeDescendant"
    [attr.aria-invalid]="invalid ? 'true' : null"
    [attr.aria-describedby]="describedByChain"
    (input)="onInput($any($event.target).value)"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
  />

  <ul
    class="ta-list"
    role="listbox"
    [id]="listboxId"
    [attr.data-testid]="testId ? testId + '-listbox' : null"
    [hidden]="!open()"
    [attr.aria-label]="'User suggestions for ' + (value || 'your search')"
  >
    <li
      *ngFor="let u of options(); let i = index"
      class="ta-option"
      role="option"
      [id]="optionId(i)"
      [class.is-active]="i === activeIndex()"
      [attr.aria-selected]="i === activeIndex()"
      [attr.data-option]="u.username"
      (mousedown)="choose(u)"
    >
      <span class="ta-username">{{ u.username }}</span>
      <span class="ta-sub">{{ subtitle(u) }}</span>
    </li>
  </ul>

  <!--
    Announces the count / keep-typing / no-matches states. Also referenced from the
    input's aria-describedby chain, so the current state is read with the control.
  -->
  <span
    class="ta-status hint"
    [id]="statusId"
    [attr.data-testid]="testId ? testId + '-status' : null"
    role="status"
    aria-live="polite"
  >{{ statusText }}</span>
</div>
