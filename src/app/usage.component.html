<section class="snap-usage" data-testid="usage-view" aria-labelledby="usage-heading">
  <h2 id="usage-heading">Usage analytics</h2>
  <p data-testid="usage-summary">
    Active users (1h): <strong data-testid="usage-active">{{ usage()?.activeUsers ?? 0 }}</strong>
    · Total events: <strong data-testid="usage-total">{{ usage()?.totalEvents ?? 0 }}</strong>
  </p>

  <h3 id="usage-by-module-heading">By module</h3>
  <table data-testid="usage-by-module" aria-labelledby="usage-by-module-heading">
    <thead>
      <tr><th scope="col">Module</th><th scope="col">Events</th><th scope="col">Users</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let m of usage()?.byModule" [attr.data-module]="m.module">
        <td>{{ m.module }}</td><td>{{ m.events }}</td><td>{{ m.users }}</td>
      </tr>
    </tbody>
  </table>

  <h3 id="usage-by-action-heading">By action</h3>
  <table data-testid="usage-by-action" aria-labelledby="usage-by-action-heading">
    <thead>
      <tr><th scope="col">Action</th><th scope="col">Events</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let a of usage()?.byAction" [attr.data-action]="a.action">
        <td>{{ a.action }}</td><td>{{ a.events }}</td>
      </tr>
    </tbody>
  </table>
</section>
