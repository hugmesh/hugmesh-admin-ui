# Publishes the admin-ui image to ghcr.io/hugmesh/hugmesh-admin-ui.
#
# What each trigger does:
#   push to main              -> image tags :main and :sha-<12>
#   push of tag v<version>    -> image tags :<version>, :beta (beta versions only)
#                                and :sha-<12>, then a GitHub Release marked
#                                prerelease and never "latest"
#   workflow_dispatch on main -> same as a push to main
#   workflow_dispatch on a v* tag -> re-runs that release: an image tag that
#                                already exists is never overwritten (the build
#                                is skipped), and the GitHub Release is created
#                                only if it is missing
#   anything else             -> refused by the `version` job
#
# Every run passes the `test` job (the unit suite, as in the GitLab `test`
# stage) before any image is pushed.
#
# The version comes from package.json `.version`, and package-lock.json must
# carry the same string. A tag must be exactly `v` + that version. `:latest` is
# never pushed by this workflow.
#
# Runner: publish jobs use the self-hosted runner named by the repo variable
# RUNS_ON_PUBLISH (a JSON array, e.g. ["self-hosted","Linux","X64"]) ONLY for
# main, v* tags and dispatches on those refs; everything else, and every run
# while the variable is unset, uses hosted ubuntu-latest. Deleting
# RUNS_ON_PUBLISH sends every job back to hosted runners. This workflow has no
# pull_request / pull_request_target trigger and must never get one: a public
# repo must not run fork code on the self-hosted runner. (The runs-on test is
# defence in depth, not a security boundary; the runner group settings are.)
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hugmesh/hugmesh-admin-ui

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      kind: ${{ steps.v.outputs.kind }}
      version: ${{ steps.v.outputs.version }}
      sha12: ${{ steps.v.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and check the version
        id: v
        run: |
          set -euo pipefail
          version="$(python3 -c '
          import json, sys
          pkg = json.load(open("package.json"))["version"]
          lock = json.load(open("package-lock.json"))
          for where, v in (("package-lock.json version", lock.get("version")),
                           ("package-lock.json root package version", lock.get("packages", {}).get("", {}).get("version"))):
              if v != pkg:
                  sys.exit(f"package.json version {pkg!r} != {where} {v!r}")
          print(pkg)
          ')"
          if ! printf '%s\n' "$version" | grep -aEx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?' >/dev/null; then
            echo "::error::package.json version '$version' is not MAJOR.MINOR.PATCH[-pre.N]"
            exit 1
          fi
          case "$version" in
            *SNAPSHOT*) echo "::error::refusing to publish a SNAPSHOT version ($version)"; exit 1 ;;
          esac
          case "$GITHUB_REF" in
            refs/heads/main)
              kind=main ;;
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::tag '$GITHUB_REF_NAME' does not match package.json version '$version' (expected tag v$version)"
                exit 1
              fi
              kind=release ;;
            *)
              echo "::error::publishing runs only on main or a v<version> tag, not on '$GITHUB_REF'"
              exit 1 ;;
          esac
          {
            echo "kind=$kind"
            echo "version=$version"
            echo "sha12=${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"
          echo "kind=$kind version=$version sha=${GITHUB_SHA:0:12}"

  # Same gate as the GitLab `test` stage: the unit suite must pass before any
  # image is pushed. It runs in a throwaway node:24-alpine container on a COPY
  # of the checkout, so nothing root-owned is left in a self-hosted runner's
  # workspace.
  test:
    needs: version
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unit tests (ng test, headless Chromium)
        run: |
          set -euo pipefail
          docker run --rm --shm-size=1gb -v "$PWD:/src:ro" node:24-alpine sh -euc '
            mkdir /w
            tar -C /src --exclude=./node_modules --exclude=./.git -cf - . | tar -C /w -xf -
            cd /w
            apk add --no-cache chromium >/dev/null
            npm ci --no-audit --no-fund
            CHROME_BIN=/usr/bin/chromium npm test -- --browsers ChromeHeadlessCI
          '

  image:
    needs: [version, test]
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      KIND: ${{ needs.version.outputs.kind }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          skip=false
          if [ "$KIND" = release ]; then
            # A published version tag is immutable: never overwrite it.
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                echo "::notice::$image:$VERSION already exists; not rebuilding it (re-run of an existing release)"
                skip=true
              else
                echo "::error::$image:$VERSION already exists; a published version is never overwritten. Raise the version instead."
                exit 1
              fi
            fi
            tags="$image:$VERSION"
            case "$VERSION" in
              *-beta.*) tags="$tags"$'\n'"$image:beta" ;;
            esac
            tags="$tags"$'\n'"$image:sha-$SHA12"
            label_version="$VERSION"
          else
            tags="$image:main"$'\n'"$image:sha-$SHA12"
            label_version=main
          fi
          {
            echo "skip=$skip"
            echo "label_version=$label_version"
            echo "tags<<__TAGS__"
            printf '%s\n' "$tags"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"
          printf 'tags:\n%s\n' "$tags"

      - name: Build and push image
        id: build
        if: steps.tags.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.label_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          if "latest" in tags:
              sys.exit("::error::a :latest tag was pushed; beta images must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, test, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Create the GitHub Release (prerelease, never latest)
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag already exists; leaving it as it is"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$tag" --verify-tag "${prerelease[@]}" --latest=false \
            --title "$tag" \
            --notes "Container image: ghcr.io/$GH_REPO:$VERSION"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
