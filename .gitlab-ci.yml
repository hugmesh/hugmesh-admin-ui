# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Centralized OWASP pen-test stage (SCA + authenticated ZAP DAST baseline) pulled
# from the generator. ONE source of truth: onboarded repos get the full harness
# (Dependency-Check SCA + ZAP baseline + custom probes + nuclei) by extending the
# hidden .pentest-* jobs below. See memory hugmesh-pentest-standard.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, e2e, build, pentest]

test:
  stage: test
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker run --rm --shm-size=1gb -v "${CI_PROJECT_DIR}:/workspace:ro" -w /workspace node:24-alpine sh -c "apk add --no-cache chromium && npm ci && CHROME_BIN=/usr/bin/chromium npm test -- --browsers ChromeHeadlessCI"
  artifacts:
    when: always
    reports:
      junit:
        - reports/TESTS-*.xml
        - test-results/results.xml
    paths:
      - reports/
      - test-results/
    expire_in: 7 days

# -----------------------------------------------------------------------------
# e2e:bdd — Playwright + playwright-bdd Gherkin harness for the admin-ui remote
# (e2e/). Every scenario that needs a live stack is tagged `@cluster` and the
# default playwright config filters them out (`tags: 'not @cluster'`); the
# untagged `@offline` lane (pure client-side UI behaviour) runs against
# `ng serve admin` with E2E_BASE_URL — see e2e/README.md. This job runs WITHOUT a
# cluster AND without a browser: it only proves the harness installs, the
# .feature files COMPILE (bddgen — default + no-filter), and every scenario is
# DISCOVERABLE (`playwright test --list` via a no-filter override) — the offline
# structural gates the PR validates. `allow_failure: true` keeps it NON-BLOCKING
# (no app-code/karma coupling) while the env-test-build wiring for the live run
# lands in a later wave; un-skip by dropping a feature's `@cluster` tag then.
# -----------------------------------------------------------------------------
e2e:bdd:
  stage: e2e
  needs: []
  tags: [hugmesh-x86, privileged]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # node:24 (not -alpine) — Playwright's CLI prefers glibc; we never launch a
    # browser here (compile + list only), so no browser download is needed.
    - >-
      docker run --rm -v "${CI_PROJECT_DIR}/e2e:/e2e" -w /e2e node:24 sh -c '
        npm ci &&
        npx bddgen &&
        printf "%s\n" \
          "import { defineConfig, devices } from \"@playwright/test\";" \
          "import { defineBddConfig } from \"playwright-bdd\";" \
          "const d = defineBddConfig({ features: \"features/**/*.feature\", steps: [\"features/steps/**/*.ts\", \"features/support/**/*.ts\"] });" \
          "export default defineConfig({ reporter: [[\"list\"]], use: { ignoreHTTPSErrors: true, screenshot: \"on\", video: \"on\" }, projects: [{ name: \"bdd\", testDir: d, use: { ...devices[\"Desktop Chrome\"] } }] });" \
          > pw-validate.config.ts &&
        npx bddgen -c pw-validate.config.ts &&
        npx playwright test --list -c pw-validate.config.ts
      '
  artifacts:
    when: always
    paths:
      - e2e/results/
    expire_in: 7 days

build:image:
  needs: [test]
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# OWASP pen-test stage — extends the centralized .pentest-* jobs from the
# generator (included above). Non-blocking (allow_failure) so a finding surfaces
# in the MR security widget without breaking the build/image pipeline; rules
# mirror this repo's existing security-job rules (default branch + merge request).
# -----------------------------------------------------------------------------

# SCA — OWASP Dependency-Check over this repo (self-checkout). The full harness
# scan; the `make pentest` target mirrors it locally with `npm audit`.
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# DAST — authenticated ZAP baseline (passiveScan + spider + custom probes +
# nuclei) via the shared harness. This Angular repo does not vendor the harness,
# so fetch it from the generator into PENTEST_HARNESS_DIR before the base script
# runs run-pentest.sh.
pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  variables:
    PENTEST_HARNESS_DIR: "${CI_PROJECT_DIR}/.pentest-harness/tests/pentest"
  before_script:
    - rm -rf .pentest-harness
    - git clone --depth 1 --branch main "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/hugmesh/hugmesh-generator.git" .pentest-harness
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
